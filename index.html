<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nayem Mia — AI Professional</title>
<style>
:root{--bg:#f1f1f1;--txt:#0a0a0a;--mut:#555;--glass:rgba(255,255,255,.5);--gb:rgba(255,255,255,.8);--sh:rgba(0,0,0,.14);--ac:#0a0a0a;--ac2:#5a5a5a;--on:#fff;--b1:#c8c8c8;--b2:#9a9a9a;--b3:#e4e4e4;--inp:rgba(255,255,255,.65);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--txt:#fff;--mut:#a8a8a8;--glass:rgba(70,70,70,.38);--gb:rgba(255,255,255,.2);--sh:rgba(0,0,0,.6);--ac:#fff;--ac2:#9a9a9a;--on:#000;--b1:#3d3d3d;--b2:#242424;--b3:#555;--inp:rgba(20,20,20,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--txt:#fff;--mut:#a8a8a8;--glass:rgba(70,70,70,.38);--gb:rgba(255,255,255,.2);--sh:rgba(0,0,0,.6);--ac:#fff;--ac2:#9a9a9a;--on:#000;--b1:#3d3d3d;--b2:#242424;--b3:#555;--inp:rgba(20,20,20,.55);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;min-height:100vh}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;z-index:-1;animation:fl 18s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:var(--b1);top:-12vmax;left:-10vmax}.b2{width:40vmax;height:40vmax;background:var(--b2);bottom:-10vmax;right:-8vmax;animation-delay:-6s}.b3{width:28vmax;height:28vmax;background:var(--b3);top:40%;left:45%;opacity:.45;animation-delay:-11s}
@keyframes fl{to{transform:translate(6vmax,4vmax) scale(1.15)}}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid var(--gb);border-radius:30px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12),0 14px 44px var(--sh)}
nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
nav a,nav button{color:var(--txt);text-decoration:none;font:500 14px/1 inherit;font-family:inherit;padding:10px 14px;border-radius:999px;border:0;background:none;cursor:pointer;white-space:nowrap;transition:.25s}
nav a:hover,nav button:hover{background:rgba(255,255,255,.35)}
main{max-width:1060px;margin:0 auto;padding:96px 18px 40px}
section{margin-bottom:26px}
.hero{display:grid;grid-template-columns:1fr;gap:22px;padding:22px;align-items:center}
@media(min-width:760px){.hero{grid-template-columns:1.15fr .85fr;padding:40px;gap:36px}.hero .ph{order:2}}
.ph{border-radius:26px;overflow:hidden;background:#fff;aspect-ratio:4/5;box-shadow:0 10px 36px var(--sh),inset 0 0 0 1px var(--gb);max-width:380px;width:100%;margin:0 auto}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.tag{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--txt);background:rgba(128,128,128,.2)}
h1{font-size:clamp(38px,8vw,64px);line-height:1.04;margin:14px 0 6px;letter-spacing:-.03em;background:linear-gradient(120deg,var(--txt),var(--ac) 60%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:19px;color:var(--mut);margin:0 0 6px}.loc{color:var(--mut);font-size:15px;margin:0 0 20px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;font:600 15px/1 inherit;font-family:inherit;border:0;cursor:pointer;text-decoration:none;color:var(--on);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.3);transition:.25s}
.btn:hover{transform:translateY(-2px)}.btn.g{color:var(--txt);background:var(--glass);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 6px 18px var(--sh);border:1px solid var(--gb)}
.row{display:flex;flex-wrap:wrap;gap:10px}
h2{font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;margin:0 0 16px}
.pad{padding:26px}@media(min-width:760px){.pad{padding:36px}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card{padding:22px;border-radius:24px;background:var(--glass);border:1px solid var(--gb);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45)}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--mut);font-size:15px}
.n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--ac),var(--ac2));margin-bottom:12px}
form{display:grid;gap:12px}
input,textarea,select{width:100%;padding:14px 16px;border-radius:18px;border:1px solid var(--gb);background:var(--inp);color:var(--txt);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
.cg{display:grid;gap:22px}@media(min-width:760px){.cg{grid-template-columns:1.2fr .8fr}}
.soc a{display:block;padding:13px 18px;margin-bottom:10px;border-radius:18px;text-decoration:none;color:var(--txt);font-weight:600;background:var(--inp);border:1px solid var(--gb);transition:.25s}.soc a:hover{transform:translateX(4px)}
footer{text-align:center;color:var(--mut);font-size:14px;padding:10px 0 30px}
#adm{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px)}
#adm.on{display:block}#adm .glass{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);border-radius:32px}
#ab{overflow:auto;padding:6px 20px;flex:1}#ab label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 5px}#ab textarea{min-height:90px}
.ah{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-weight:700;font-size:18px}.af{display:flex;gap:10px;padding:14px 20px}.af .btn{flex:1;text-align:center}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<nav class="glass"><a href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#work">Work</a><a href="#contact">Contact</a></nav>
<main>
<section id="home" class="glass hero"><div class="ph"><img id="photo" alt="Portrait of Nayem Mia"></div><div><span class="tag" id="tag"></span><h1 id="name"></h1><p class="sub" id="role"></p><p class="loc" id="loc"></p><div class="row"><a class="btn" href="#contact">Hire me</a><a class="btn g" href="#work">See my work</a></div></div></section>
<section id="about" class="glass pad"><h2>About me</h2><p id="bio" style="margin:0;color:var(--mut);font-size:17px;white-space:pre-line"></p></section>
<section id="services" class="glass pad"><h2>What I do</h2><div class="grid" id="svc"></div></section>
<section id="work" class="glass pad"><h2>Selected work</h2><div class="grid" id="wk"></div></section>
<section id="contact" class="glass pad"><h2>Request a job</h2><div class="cg"><form id="f"><input id="fn" placeholder="Your name" required=""><input id="fe" type="email" placeholder="Your email" required=""><select id="fs"></select><textarea id="fm" rows="5" placeholder="Tell me about your project…" required=""></textarea><div class="row"><button class="btn" type="submit">Send by email</button><button class="btn g" type="button" id="fw" hidden="">Send on WhatsApp</button></div></form><div class="soc" id="soc"></div></div></section>
</main>
<footer id="ft"></footer>
<div id="adm"><div class="glass"><div class="ah"><span>Admin panel</span><button class="btn g" id="ax" style="padding:9px 16px">Close</button></div><div id="ab"></div><div class="af"><button class="btn" id="as">Save &amp; publish</button></div></div></div>

<script>
const pristine='<!doctype html>\n'+document.documentElement.outerHTML;
let D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SOC=[['facebook','Facebook'],['instagram','Instagram'],['whatsapp','WhatsApp'],['linkedin','LinkedIn'],['youtube','YouTube'],['tiktok','TikTok'],['telegram','Telegram'],['x','X (Twitter)']];
function url(k,v){v=(v||'').trim();if(!v)return'';if(k==='whatsapp')return'https://wa.me/'+v.replace(/\D/g,'');if(!/^https?:\/\//i.test(v))v='https://'+v;return v}
function render(){
 $('#photo').src=D.photo;$('#tag').textContent=D.tag;$('#name').textContent=D.name;$('#role').textContent=D.role;$('#loc').textContent='📍 '+D.location;$('#bio').textContent=D.bio;
 $('#svc').innerHTML=D.services.map((s,i)=>`<div class="card"><div class="n">${i+1}</div><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div>`).join('');
 $('#wk').innerHTML=D.works.map(s=>`<div class="card"><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div>`).join('')||'<p style="color:var(--mut)">Coming soon.</p>';
 $('#fs').innerHTML='<option value="">What do you need?</option>'+D.services.map(s=>`<option>${esc(s.t)}</option>`).join('')+'<option>Something else</option>';
 $('#soc').innerHTML='<p style="margin:0 0 12px;color:var(--mut)">Or reach me here:</p>'+SOC.filter(([k])=>D.social[k]).map(([k,l])=>`<a href="${esc(url(k,D.social[k]))}" target="_blank" rel="noopener">${l}</a>`).join('')+(D.email?`<a href="mailto:${esc(D.email)}">✉ ${esc(D.email)}</a>`:'');
 $('#fw').hidden=!D.social.whatsapp;$('#ft').textContent='© '+new Date().getFullYear()+' '+D.name+' · '+D.location;document.title=D.name+' — '+D.role;
}
function msg(){return `Hi ${D.name}, I’m ${$('#fn').value} (${$('#fe').value}).\nService: ${$('#fs').value||'—'}\n\n${$('#fm').value}`}
function open_(u){const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
$('#f').addEventListener('submit',e=>{e.preventDefault();if(!D.email)return alert('Email not set yet.');open_('mailto:'+encodeURIComponent(D.email).replace('%40','@')+'?subject='+encodeURIComponent('Job request from '+$('#fn').value)+'&body='+encodeURIComponent(msg()))});
$('#fw').addEventListener('click',()=>{if(!$('#f').reportValidity())return;open_(url('whatsapp',D.social.whatsapp)+'?text='+encodeURIComponent(msg()))});
render();
// ---- Admin ----
const F=[['name','Name','i'],['tag','Small tag (above name)','i'],['role','Title / tagline','i'],['location','Location','i'],['email','Email (job requests go here)','i'],['bio','About me','t'],['services','Services — one per line: Title | Description','t'],['works','Work / projects — one per line: Title | Description','t']];
const L=a=>a.map(x=>x.t+(x.d?' | '+x.d:'')).join('\n');
function parse(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|');return{t:p[0].trim(),d:p.slice(1).join('|').trim()}})}
function build(){
 $('#ab').innerHTML=`<label>Photo</label><input type="file" id="ap" accept="image/*">`+F.map(([k,l,t])=>{const v=Array.isArray(D[k])?L(D[k]):D[k];return`<label>${l}</label>`+(t==='t'?`<textarea data-k="${k}">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}">`)}).join('')+'<label>Social links (leave empty to hide)</label>'+SOC.map(([k,l])=>`<input data-s="${k}" placeholder="${l}${k==='whatsapp'?' number, e.g. 905xxxxxxxxx':' link'}" value="${esc(D.social[k])}" style="margin-bottom:8px">`).join('');
 $('#ap').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,700/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);D.photo=c.toDataURL('image/jpeg',.86);$('#photo').src=D.photo};im.src=URL.createObjectURL(f)};
}
